<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encontre seu novo melhor amigo. Adote cães e gatos em Pernambuco.">
    <title>Processo de Adoção | Meu Futuro Amigo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Afacad:ital,wght@0,400..700;1,400..700&family=Anton&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/processo-adocao.css">
    <link rel="icon" type="image/png" href="/img/favicon.png">
</head>
<body>
    <div id="header"></div>

    <main class="processo-adocao">

        <div class="container-card">
            <div class="header-resumo-animal">
                <div class="foto-resumo-wrapper">
                    <img id="resumo-foto" src="" alt="Foto do Animal">
                </div>
                <div class="dados-resumo-wrapper">
                    <h2 class="titulo-resumo">Você está se candidatando para adotar:</h2>
                    <h3 id="resumo-nome" class="nome-grande">Carregando...</h3>
                    <div class="tags-resumo">
                        <span id="resumo-detalhes">Raça | Idade</span>
                        <span class="separador">•</span>
                        <span id="resumo-local">Cidade - PE</span>
                    </div>
                </div>
            </div>

            <form id="form-adocao" class="formulario-vertical">
                
                <p class="intro-form">Preencha os dados abaixo com atenção. Os campos marcados com (<b>*</b>) são obrigatórios.</p>

                <fieldset class="grupo-form">
                    <legend>Seus Dados:</legend>
                    
                    <div class="linha-input">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" readonly class="input-travado" placeholder="Carregando...">
                    </div>

                    <div class="linha-input">
                        <label for="cpf">CPF <span class="obrigatorio">*</span></label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                    </div>

                    <div class="grid-duplo">
                        <div class="linha-input">
                            <label for="nascimento">Data de Nascimento <span class="obrigatorio">*</span></label>
                            <input type="date" id="nascimento" name="nascimento" required>
                        </div>
                        <div class="linha-input">
                            <label for="ocupacao">Profissão / Ocupação <span class="obrigatorio">*</span></label>
                            <input type="text" id="ocupacao" name="ocupacao" placeholder="Ex: Professor, Autônomo..." required>
                        </div>
                    </div>

                    <div class="grid-duplo">
                        <div class="linha-input">
                            <label for="whatsapp">Número / WhatsApp</label>
                            <input type="text" id="whatsapp" name="whatsapp" readonly class="input-travado">
                        </div>
                        <div class="linha-input">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" readonly class="input-travado">
                        </div>
                    </div>

                    <div class="linha-input">
                        <label for="endereco">Endereço Completo (Rua, Número, Bairro) <span class="obrigatorio">*</span></label>
                        <input type="text" id="endereco" name="endereco" placeholder="Ex: Rua das Flores, 123, Centro" required>
                    </div>

                    <div class="grid-duplo">
                        <div class="linha-input">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade" readonly class="input-travado">
                        </div>
                        <div class="linha-input">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep" readonly class="input-travado">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="grupo-form">
                    <legend>Onde o Pet vai morar?</legend>
                    
                    <div class="grid-duplo">
                        <div class="linha-input">
                            <label for="tipo-imovel">Tipo de Imóvel <span class="obrigatorio">*</span></label>
                            <select id="tipo-imovel" name="tipo-imovel" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option value="casa">Casa</option>
                                <option value="apartamento">Apartamento</option>
                                <option value="sitio">Sítio / Chácara</option>
                            </select>
                        </div>
                        <div class="linha-input">
                            <label for="posse-imovel">Situação <span class="obrigatorio">*</span></label>
                            <select id="posse-imovel" name="posse-imovel" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option value="proprio">Próprio</option>
                                <option value="alugado">Alugado</option>
                            </select>
                        </div>
                    </div>

                    <div class="linha-input" id="div-permissao">
                        <label>O proprietário permite animais?</label>
                        <div class="radio-group">
                            <label><input type="radio" name="permissao-proprietario" value="sim"> Sim</label>
                            <label><input type="radio" name="permissao-proprietario" value="nao"> Não</label>
                        </div>
                    </div>

                    <div class="linha-input">
                        <label for="seguranca-casa">Segurança (Descreva muros, portões e rotas de fuga) <span class="obrigatorio">*</span></label>
                        <textarea id="seguranca-casa" name="seguranca-casa" rows="2" placeholder="Ex: Muros altos, portão fechado..." required></textarea>
                    </div>

                    <div class="grid-duplo">
                        <div class="linha-input">
                            <label>Possui telas de proteção nas janelas?</label>
                            <div class="radio-group">
                                <label><input type="radio" name="telas" value="sim"> Sim</label>
                                <label><input type="radio" name="telas" value="nao"> Não</label>
                            </div>
                        </div>
                        <div class="linha-input">
                            <label>Possui piscina?</label>
                            <div class="radio-group">
                                <label><input type="radio" name="piscina" value="sim"> Sim</label>
                                <label><input type="radio" name="piscina" value="nao" checked> Não</label>
                            </div>
                        </div>
                    </div>

                    <div class="linha-input">
                        <label for="dormida">Onde o animal irá dormir? <span class="obrigatorio">*</span></label>
                        <input type="text" id="dormida" name="dormida" placeholder="Ex: Dentro de casa, na garagem, no quintal..." required>
                    </div>
                </fieldset>

                <fieldset class="grupo-form">
                    <legend>Família e Rotina:</legend>

                    <div class="grid-duplo">
                        <div class="linha-input">
                            <label for="moradores">Quantas pessoas moram na casa? <span class="obrigatorio">*</span></label>
                            <input type="number" id="moradores" name="moradores" min="1" required>
                        </div>
                        <div class="linha-input">
                            <label for="criancas">Tem crianças? (Se sim, idades)</label>
                            <input type="text" id="criancas" name="criancas" placeholder="Ex: Sim, uma de 5 anos">
                        </div>
                    </div>

                    <div class="linha-input">
                        <label for="tempo-sozinho">Tempo sozinho (horas/dia) <span class="obrigatorio">*</span></label>
                        <select id="tempo-sozinho" name="tempo-sozinho" required>
                            <option value="0-4">Pouco (0 a 4h)</option>
                            <option value="4-8">Médio (4 a 8h)</option>
                            <option value="8+">Muito (8h ou mais)</option>
                        </select>
                    </div>

                    <div class="linha-input">
                        <label for="outros-animais">Já possui outros animais? Se sim, quais? <span class="obrigatorio">*</span></label>
                        <textarea id="outros-animais" name="outros-animais" rows="2" placeholder="Ex: Tenho 1 gato castrado e 1 cachorro..." required></textarea>
                    </div>
                </fieldset>

                <fieldset class="grupo-form destaque-termo">
                    <legend>Acordo:</legend>
                    
                    <div class="checkbox-legal">
                        <input type="checkbox" id="check-custos" required>
                        <label for="check-custos">Estou ciente dos custos com ração de qualidade, vacinas anuais e veterinário.</label>
                    </div>

                    <div class="checkbox-legal">
                        <input type="checkbox" id="check-verdade" required>
                        <label for="check-verdade">Declaro que as informações acima são verdadeiras e autorizo o contato para entrevista.</label>
                    </div>
                </fieldset>

                <button type="submit" class="botao-enviar-grande">Enviar Solicitação de Adoção</button>

            </form>
        </div>

    </main>
    
    <div id="footer"></div>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/processo-adocao.js"></script>
</body>
</html>
