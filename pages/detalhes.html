<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conheça todos os detalhes do seu futuro melhor amigo.">
    <title>Detalhes do Pet | Meu Futuro Amigo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Afacad:ital,wght@0,400..700;1,400..700&family=Anton&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"/>
    <link rel="stylesheet" href="../css/detalhes.css"> 
    <link rel="icon" type="image/png" href="/img/favicon.png">
</head>
<body>
    <div id="header"></div>

    <main class="Pagina-Detalhes">
        <div class="Container-Card">

            <div class="Coluna-Esquerda">
                
                <div class="Carrossel-Wrapper">
                    <button class="seta-carrossel anterior" onclick="mudarMidia(-1)">❮</button>
                    <div id="midia-container" class="Midia-Visualizacao">
                        <img id="img-principal" src="" alt="Foto do Animal">
                    </div>
                    <button class="seta-carrossel proxima" onclick="mudarMidia(1)">❯</button>
                    <span id="contador-midia" class="Contador">1/5</span>
                </div>

                <h1 id="detalhes-nome" class="Nome-Animal">Nome do Pet</h1>

                <div class="Grid-Tags-Informacao" id="container-tags"></div>
                
            </div>

            <div class="Coluna-Direita">
                
                <div class="Historia-Box">
                    <h3>Minha História</h3>
                    <p id="detalhes-historia">Carregando história...</p>
                </div>

                <div class="Container-Saude" id="container-saude"></div>

                <div class="Area-Acao">
                    <a id="botaoAdotar" href="../pages/processo-adocao.html" target="_blank" class="Botao-Adotar-Gigante">
                        Quero Adotar
                    </a>
                    <div id="status-fila" class="Status-Fila-Texto"></div>
                </div>

            </div>

        </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/detalhes.js"></script>
</body>
</html>
