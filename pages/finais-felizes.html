<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finais Felizes | Meu Futuro Amigo</title> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Afacad:ital,wght@0,400..700;1,400..700&family=Anton&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/finais-felizes.css">
</head>
<body>
    <div id="header"></div>

    <main class="Pagina-Historias">
        
        <section class="Topo-Pagina">
            <h1 class="Titulo-Secao">Adotados Recentemente</h1>
            
            <div class="Filtros-Container">
                <button class="Btn-Filtro ativo" onclick="filtrarHistorias('todos')">Mostrar Todos</button>
                <button class="Btn-Filtro" onclick="filtrarHistorias('Cachorro')">Cães</button>
                <button class="Btn-Filtro" onclick="filtrarHistorias('Gato')">Gatos</button>
            </div>
        </section>

        <section id="lista-historias" class="Lista-Historias"> </section>

        <div class="paginacao-container" id="paginacao">
            <button id="btn-ant" onclick="mudarPagina(-1)">❮</button>
            <span id="indicador-paginacao">Página 1 de 1</span>
            <button id="btn-prox" onclick="mudarPagina(1)">❯</button>
        </div>

        <section class="Chamada-Final">
            <h2 class="Titulo-CTA">Pronto para Escrever sua Própria História?</h2>
            <p class="Subtitulo-CTA">O próximo final feliz pode ser o seu. Veja os animais que estão esperando por uma chance agora mesmo.</p>
            <a href="../pages/adotar.html" class="Botao-Laranja-CTA">Encontrar Meu Novo Amigo!</a>
        </section>

    </main>

    <div id="footer"></div>
</body>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/finais-felizes.js"></script>
</html>
