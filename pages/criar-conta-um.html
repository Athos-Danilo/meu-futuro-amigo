<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - 1ª Parte| Meu Melhor Amigo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Afacad:ital,wght@0,400..700;1,400..700&family=Anton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/criar-conta-um.css">
    <link rel="icon" type="image/png" href="/img/favicon.png">
</head>
<body>
    <main class="Cadastrar-Container">

        <section class="Imagem">
        <img src="../img/Mulher-Beijando-Um-Gato.png" alt="Mulher Beijando um Gato">
        </section>
        
        <section class="Painel-do-Formulário">

            <img class="Logo" src="../img/Logo (Branco) web 1.png" alt="Logo Meu Melhor Amigo">
            <h1>Conectando Corações e Patas</h1>
            <h2>Bem-vindo! Crie sua Conta</h2>

            <form action="#" method="POST" novalidate>

                <div class="Dados-Usuário">
                    <label for="Nome-Completo">Nome Completo</label>
                    <input type="text" id="Nome-Completo" name="Nome-Completo" placeholder="Digite seu Nome Completo" required>
                </div>

                <div class="Dados-Usuário">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu E-mail" required>
                </div>

                <div class="Dados-Usuário">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua Senha" required>
                    <img src="../img/olho-fechado.png" alt="Mostrar Senha" class="ícone-olho-fechado" id="olho-fechado">
                </div>

                <div class="Dados-Usuário">
                    <label for="Confirmar-Senha">Confirmar Senha</label>
                    <input type="password" id="confirmar-senha" name="senha" placeholder="Digite novamente sua Senha" required>
                    <img src="../img/olho-fechado.png" alt="Mostrar Senha" class="ícone-olho-fechado" id="olho-fechado-confirmar">
                </div>

                <p class="Mensagem-de-Erro" id="mensagemErro"></p>

                <button type="submit" class="Botão-Criar-Conta">Criar Conta</button>

            </form>

            <p class="tenho-conta">Já tem uma conta? <a href="entrar.html">Faça o Login</a> </p>

        </section>
    </main>

    <script src="../js/criar-conta-um.js"></script>    
</body>
</html>
