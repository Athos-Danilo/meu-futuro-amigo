<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta | Meu Futuro Amigo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Afacad:ital,wght@0,400..700;1,400..700&family=Anton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/minha-conta.css">
</head>
<body>
    <div id="Cabeçalho"></div>

    <main class="Perfil-Container">

        <aside class="Perfil">

            <div class="Card-Laranja">

                <div class="Foto-Perfil">
                    <img src="../img/Perfil.png" alt="Foto do Perfil do Usuário">
                </div>

                <div class="Info-Usuário">
                    <h2 id="nomeUsuario">Nome Usuário</h2>

                    <div class="Info-Contato">
                        <p id="cidadeEstado">Cidade - Estado</p>
                        <p id="telefone">(XX) XXXXX-XXXX</p>
                    </div>
                </div>

                <div class="Ações-Sidebar">
                    <button class="Btn-Meus-Dados">Meus Dados</button>
                    <a href="#" class="Link-Sair" id="btn-sair">Sair</a>
                </div>

            </div>

        </aside>

        <section class="Retângulo-Navegação">

            <nav class="Abas-Navegação">
                <button class="Aba-Item">Notificações</button>
                <button class="Aba-Item-Ativa">Minhas Adoções</button>
                <button class="Aba-Item">Minhas Divulgações</button>
            </nav>

            <div class="Card-Branco">
                <div class="Chamada">
                    <h3 class="Título">Você ainda não adotou<br>nenhum bichinho</h3>
                    <img src="../img/ilustração cachorro triste.png" alt="Cachorro Triste" class="Imagem">
                    <a href="#" class="Btn-Encontrar-Amigo">Encontrar um Amigo</a>
                </div>
            </div>

        </section>

        <section class="Seção-Meus-Dados" style="display: none;">
        
            <div class="Card-Branco Form-Card">
                <div class="Header-Form">
                    <h2 class="Título-Form">Meus Dados</h2>
                    <button class="Btn-Voltar" id="btn-cancelar-edicao">Fechar</button>
                </div>

                <form id="form-editar-perfil">
                    
                    <div class="Upload-Container">
                        <div class="Preview-Wrapper">
                            <img src="../img/Perfil.png" id="preview-foto" alt="Preview da Foto">
                            <label for="input-upload-foto" class="Btn-Trocar-Foto">
                                📷
                            </label>
                        </div>
                        <p class="Texto-Upload">Toque na câmera para alterar a foto</p>
                        <input type="file" id="input-upload-foto" name="foto_perfil" accept="image/*" hidden disabled>
                    </div>

                    <div class="Grid-Form">
                        <div class="Input-Group Span-2">
                            <label for="input-nome">Nome Completo</label>
                            <input type="text" id="input-nome" disabled class="Bloqueado-Permanente">
                        </div>

                        <div class="Input-Group Span-2">
                            <label for="input-email">E-mail</label>
                            <input type="email" id="input-email" disabled class="Bloqueado-Permanente">
                        </div>

                        <div class="Input-Group">
                            <label for="input-telefone">WhatsApp / Celular</label>
                            <input type="tel" id="input-telefone" placeholder="Não informado" disabled>
                        </div>

                        <div class="Input-Group">
                            <label for="input-cep">CEP</label>
                            <input type="text" id="input-cep" placeholder="00000-000" disabled>
                        </div>

                        <div class="Input-Group">
                            <label for="input-cidade">Cidade</label>
                            <input type="text" id="input-cidade" placeholder="Não informado" disabled>
                        </div>

                        <div class="Input-Group">
                            <label for="input-estado">Estado (UF)</label>
                            <select id="input-estado" disabled>
                                <option value="">Selecione</option>
                                <option value="PE">Pernambuco</option>
                                <option value="SP">São Paulo</option>
                                </select>
                        </div>
                    </div>

                    <div class="Footer-Form">
                        <button type="button" id="btn-acao-principal" class="Btn-Salvar-Dados">Editar Informações</button>
                    </div>

                </form>
            </div>

        </section>

    </main>

    <script src="../js/header.js"></script>
    <script src="../js/minha-conta.js"></script>
</body>
</html>
