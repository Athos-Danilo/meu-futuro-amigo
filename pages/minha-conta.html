<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta | Meu Futuro Amigo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Afacad:ital,wght@0,400..700;1,400..700&family=Anton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/minha-conta.css">
</head>
<body>
    <div id="Cabeçalho"></div>

    <main class="Perfil-Container">

        <aside class="Perfil">

            <div class="Card-Laranja">

                <div class="Foto-Perfil">
                    <img src="../img/Perfil.png" alt="Foto do Perfil do Usuário">
                </div>

                <div class="Info-Usuário">
                    <h2 id="nomeUsuario">Athos</h2>

                    <div class="Info-Contato">
                        <p id="cidadeEstado">Lajedo - Pernambuco</p>
                        <p id="telefone">(87) 98156-4338</p>
                    </div>
                </div>

                <div class="Ações-Sidebar">
                    <button class="Btn-Meus-Dados">Meus Dados</button>
                    <a href="#" class="Link-Sair" id="btn-sair">Sair</a>
                </div>

            </div>

        </aside>

        <section class="Retângulo-Navegação">

            <nav class="Abas-Navegação">
                <button class="Aba-Item">Notificações</button>
                <button class="Aba-Item-Ativa">Minhas Adoções</button>
                <button class="Aba-Item">Minhas Divulgações</button>
            </nav>

            <div class="Card-Branco">
                <div class="Chamada">
                    <h3 class="Título">Você ainda não adotou<br>nenhum bichinho</h3>
                    <img src="../img/ilustração cachorro triste.png" alt="Cachorro Triste" class="Imagem">
                    <a href="#" class="Btn-Encontrar-Amigo">Encontrar um Amigo</a>
                </div>
            </div>

        </section>

    </main>

    <script src="../js/header.js"></script>
    <script src="../js/minha-conta.js"></script>
</body>
</html>
