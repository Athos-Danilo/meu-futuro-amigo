<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encontre seu novo melhor amigo. Adote cães e gatos em Pernambuco.">
    <title>Adotar | Meu Futuro Amigo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Afacad:ital,wght@0,400..700;1,400..700&family=Anton&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/adotar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"/>
</head>
<body>
    <div id="Cabeçalho"></div>
    
    <main>
        <section class="apresetacao">
            <h1 class="titulo">Encontre Seu Futuro Amigo</h1>
            <p class="subtitulo">Use os filtros abaixo para encontrar o companheiro ideal para o seu perfil</p>
    
            <button class="botao-abrir-filtros" onclick="toggleFiltros()">
                <img src="../img/Ajustes.png" alt="Ícone de Ajustes">Filtrar Animais
            </button>

            <div class="container-filtros" id="filtros-container">
                <button class="botao-fechar-filtros" onclick="toggleFiltros()">X</button>

                <div class="grupo-filtro">
                    <label for="cidade">Localização:</label>
                    <input list="cidades" id="cidade" name="cidade" placeholder="Digite a cidade...">
                    <datalist id="cidades"></datalist>
                </div>

                <div class="grupo-filtro">
                    <label>Espécie:</label>
                    <select id="filtro-especie">
                        <option value="">Selecione...</option>
                        <option value="Cachorro">Cachorro</option>
                        <option value="Gato">Gato</option>
                    </select>
                </div>

                <div class="grupo-filtro" id="container-raca-cachorro" style="display: none;">
                    <label for="filtro-raca-cachorro">Raça:</label>
                    <select id="filtro-raca-cachorro">
                        <option value="">Todas</option>
                    </select>
                </div>

                <div class="grupo-filtro" id="container-raca-gato" style="display: none;">
                    <label for="filtro-raca-gato">Raça:</label>
                    <select id="filtro-raca-gato">
                        <option value="">Todas</option>
                    </select>
                </div>

                <div class="grupo-filtro">
                    <label>Porte:</label>
                    <select id="filtro-porte">
                        <option value="">Todos</option>
                        <option value="Pequeno">Pequeno</option>
                        <option value="Médio">Médio</option>
                        <option value="Grande">Grande</option>
                    </select>
                </div>

                <div class="grupo-filtro">
                    <label>Sexo:</label>
                    <select id="filtro-sexo">
                        <option value="">Todos</option>
                        <option value="Macho">Macho</option>
                        <option value="Fêmea">Fêmea</option>
                    </select>
                </div>

                <div class="grupo-filtro">
                    <label for="filtro-idade">Idade:</label>
                    <select id="filtro-idade">
                        <option value="">Todas</option>
                    </select>
                </div>

                <div class="grupo-filtro">
                    <label>Origem:</label>
                    <select id="filtro-origem">
                        <option value="">Todas</option>
                        <option value="Abrigo">Abrigo</option>
                        <option value="Protetor">Pessoal</option>
                    </select>
                </div>

                <button class="botao-aplicar-filtros" onclick="aplicarFiltros()">Aplicar Filtros</button>
            </div>
        </section>

        <section class="Galeria-Animais">
            <div class="Grid-Animais" id="grid-animais">
                </div>
            
            <div id="mensagem-sem-resultados" style="display: none;">
                <p>Não encontramos nenhum peludinho com essas características agora. Que tal ajustar os filtros e tentar novamente?</p>
                <button onclick="limparFiltros()">Limpar Filtros</button>
            </div>

            <div id="paginacao-container" class="paginacao-container">
                <button id="btn-ant" onclick="mudarPagina(-1)">❮</button>
                <span id="indicador-paginacao">Página 1</span>
                <button id="btn-prox" onclick="mudarPagina(1)">❯</button>
            </div>
        </section>
    </main>

    <div id="modal-animal" class="Modal-Fundo" style="display: none;">
        <div class="Modal-Conteudo">
            <span class="Fechar-Modal" onclick="fecharModalDetalhes()">&times;</span>
            
            <div class="Modal-Grid">
                <div class="Modal-Imagem">
                    <div class="Galeria-Wrapper">
                        <button class="seta-galeria anterior" onclick="mudarFoto(-1)">❮</button>
                        <img id="modal-img" src="" alt="Foto do Animal">
                        <button class="seta-galeria proxima" onclick="mudarFoto(1)">❯</button>
                        <span id="contador-fotos">1 / 1</span>
                    </div>
                </div>
                
                <div class="Modal-Infos">
                    <h2 id="modal-nome">...</h2>
                    <p id="modal-resumo" class="Modal-Resumo">...</p>
                    
                    <div class="Modal-Detalhes-Tecnicos"></div>

                    <div class="Modal-Botoes"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/adotar.js"></script>
</body>
</html>
