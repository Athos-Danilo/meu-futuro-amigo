<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Meu Futuro Amigo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Afacad:ital,wght@0,400..700;1,400..700&family=Anton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/entrar.css">
</head>
<body>

    <main class="Login-Container">

        <section class="Imagem">
            <img src="img/Mulher beijando cachorro.png" alt="Mulher Beijando um Cachorro">
        </section>

        <section class="Painel-do-Formulário">

            <img class="Logo" src="img/Logo (Branco).png" alt="Logo Meu Futuro Amigo">
            <h1>Conectando Corações e Patas</h1>
            <h2>Que bom te ver de novo!</h2>

            <form action="#" method="POST" novalidate>

                <div class="Dados-Usuário">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu E-mail" required>
                </div>

                <div class="Dados-Usuário">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua Senha" required>
                    <img src="img/olho-fechado.png" alt="Mostrar Senha" class="ícone-olho-fechado" id="olho-fechado">
                </div>

                <p class="Mensagem-de-Erro" id="mensagemErro"></p>

                <button type="submit" class="Botão-Entrar">Entrar</button>

            </form>

            <a href="#" class="Esqueceu-sua-Senha">Esqueci Minha Senha</a>

            <p class="inscrição">
                Ainda não tem uma conta? <a href="criar-conta-um.html">Cadastre-se</a>
            </p>

        </section>

    </main>

    <script src="js/entrar.js"></script>
</body>
</html>
